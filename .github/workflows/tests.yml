# Unit tests: node --test over tests/*.test.mjs (built into Node, no dependencies). Fails on any failing test.
name: Tests

on:
  pull_request:
    paths: ['src/**', 'tests/**', '.github/workflows/tests.yml']
  push:
    branches: [main]
    paths: ['src/**', 'tests/**', '.github/workflows/tests.yml']

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test 'tests/*.test.mjs'
